l_english:

# democracy
 democratic: "Democratic"
 democratic_noun: "Democracy"
 democratic_desc: "Democratic State"
 conservatism: "Conservatism"
 conservatism_noun: "Conservative"
 conservatism_desc: "Conservatism is an ideology which seeks to preserve and promote traditional cultural values and institutions. Opposing radical change, conservatives generally advocate for moderate reforms and a return to tradition."
 liberalism: "Liberalism"
 liberalism_desc: "Liberalism is an ideology which places emphasis on individual freedoms. Seeing this as the backbone of society, liberals advocate for the protection and expansion of these rights."
 social_democracy: "Social Democracy"
 social_democracy_desc: "Social Democracy is an egalitarian form of democracy that aims to achieve socialism and equality within the framework of a capitalist system. With origins in labor and trade unions, Social Democrats support welfare states, economic democracy and reformism."
 populism: "Populism"
 populism_desc: "Populism is a political tradition that espouses the idea of a 'common people' in opposition to a hostile elitst class. Generally anti-establishment, populism can be used to support both left-wing and right-wing ideas."
 federalism: "Federalism"
 federalism_desc: "Federalism is a political concept that divides the power of governance for both central and state-level governments. Federalists often advocate for the creation of semi-autonomous regional states that are still beholden to a federal government."
 confederalism: "Confederalism"
 confederalism_desc: "Confederalism is a political concept that supports the formation of a confederation, a union of sovereign states united for a common cause. As opposed to a Federation, Confederations seek to preserve its member states' independence, with the central government being beholden to them."
 constitutional_monarchy: "Constitutional Monarchy"
 constitutional_monarchy_desc: "Constitutional Monarchy is a form of monarchy in which the monarch exercises power in accordance with a constitution. Though it has a monarch, it exists only in name and mostly serves as a unifying symbol."
 christian_democracy: "Christian Democracy"
 christian_democracy_desc: "Christian Democracy is a form of democracy which is influenced by Christian social teachings and theology. Though across the world, Christian Democratic values may differ depending on region, they are generally socially conservative but economically progressive."
 islamic_democracy: "Islamic Democracy"
 islamic_democracy_desc: "Islamic Democracy is a form of democracy which attempts to combine Islamic theology with Western liberal ideas. Though not fully a theocracy, proponents of Islamic Democracy believe that Islam should play a major part in governance."
 buddhist_democracy: "Buddhist Democracy"
 buddhist_democracy_desc: "Buddhist Democracy is a form of democracy which is influenced by Buddhist social teachings and theology. Many scholars argue that Buddhism and democracy have gone hand-in-hand throughout history, with the very foundation of many Buddhist societies being democratic."
 authoritarian_democracy: "Authoritarian Democracy"
 authoritarian_democracy_desc: "Authoritarian Democracy is a form of democracy where the executive branch of government holds all power. Though it may be contradictory, Authoritarian Democracies still feature elections whilst having a strong head of state."
 right_libertarianism: "Right-Libertarianism"
 right_libertarianism_desc: "Right-wing Libertarianism is an ideology which places emphasis on civil liberties and the free market. Seen as a radical offshoot of Classical Liberalism, Right-Libertarians believe in expanded individual rights, laissez-faire economics and small government."
 herrenvolk_democracy: "Herrenvolk Democracy"
 herrenvolk_democracy_desc: "Herrenvolk Democracy is a democratic form of ethnocracy in which one specific ethnicity gets voting rights while other groups are denied it. Though it still holds free elections, suffrage is restricted based on race."



 #neutralite
 neutrality: "Non-Aligned"
 neutrality_noun: "Non-Aligned"
 neutrality_desc: "Neutral Nation"
 despotism: "Despotism"
 despotism_desc: "Despotism is a system of governance in which a single individual, 'the Despot', rules with absolute power over the nation. The laws and policies depend on the wishes of the Despot, and rule is maintained often through military force and coercion."
 oligarchism: "Oligarchism"
 oligarchism_desc: "Oligarchism vests power within a small number of people, known as the oligarchs, which have amassed and concentrated significantly high amounts of wealth, which they use to influence or completely change politics maintain their rule over society."
 prometheanism: "Prometheanism"
 prometheanism_desc: "Prometheanism is named after the Greek titan Prometheus, who bestowed humanity with the knowledge of fire. It emphasizes upon usage and acceleration of the development of technology via human ingenuity to overcome societal and environmental challenges."
 mafia_state: "Mafia State"
 mafia_state_desc: "Mafia States involve organized crime either fully or to a certain degree, where the police, military and parts of the government collude with it, allowing it to greatly influence or change the political landscape of the nation essentially making it led by them."
 police_state: "Police State"
 police_state_desc: "Police States have their governmental organizations assume an extreme level of control over the common populace, restricting their liberties and freedoms and allowing these governmental institutions to take control of the nation."
 corporatocracy: "Corporatocracy"
 corporatocracy_desc: "Corporatocracy is a state in which a major part or all parts of the government are controlled or majorly influenced by corporations, primarily through financial control to gain undue privileges from the state."


 #communismo
 communism: "Communist"
 communism_noun: "Communism"
 communism_desc: "Socialist State"
 posadism: "Posadism"
 posadism_desc: "Posadism is an offshoot of trotskyism that adds ufology and other concepts like communication with dolphins. Notably with theories of ufology, posadism supports nuclear conflict between capitalism and communism to destroy capitalism for the working class."
 narcocommunism: "Narcocommunism"
 narcocommunism_desc: "Narcocommunism started as a rhetorical insult from conservative politicians to accuse left-wing politicians of colluding with drug cartels. Post rapture, certain cartels have used their position to almost become workers unions of their own sort, mixing cartel state policies with communist rhetoric."
 buddhist_socialism: "Buddhist Socialism"
 buddhist_socialism_desc: "Buddhist Socialism combines the socioeconomic theory of socialism with the spiritual and moral principles of Buddhism. Buddhist Socialism is sometimes theocratic in practice but isn't necessarily so."



 fascism: "Fascist"
 fascism_noun: "Fascism"
 fascism_desc: "Fascist Regime"

