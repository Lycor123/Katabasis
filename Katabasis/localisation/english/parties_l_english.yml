l_english:

# democracy
 democratic: "Democratic"
 democratic_noun: "Democracy"
 democratic_desc: "Democratic State"
 conservatism: "Conservatism"
 conservatism_noun: "Conservative"
 conservatism_desc: "Conservatism is an ideology which seeks to preserve and promote traditional cultural values and institutions. Opposing radical change, conservatives generally advocate for moderate reforms and a return to tradition."
 liberalism: "Liberalism"
 liberalism_noun: "Liberal"
 liberalism_desc: "Liberalism is an ideology which places emphasis on individual freedoms. Seeing this as the backbone of society, liberals advocate for the protection and expansion of these rights."
 social_democracy: "Social Democracy"
 social_democracy_noun: "Social Democrat"
 social_democracy_desc: "Social Democracy is an egalitarian form of democracy that aims to achieve socialism and equality within the framework of a capitalist system. With origins in labor and trade unions, Social Democrats support welfare states, economic democracy and reformism."
 populism: "Populism"
 populism_noun: "Populist"
 populism_desc: "Populism is a political tradition that espouses the idea of a 'common people' in opposition to a hostile elitst class. Generally anti-establishment, populism can be used to support both left-wing and right-wing ideas."
 federalism: "Federalism"
 federalism_noun: "Federalist"
 federalism_desc: "Federalism is a political concept that divides the power of governance for both central and state-level governments. Federalists often advocate for the creation of semi-autonomous regional states that are still beholden to a federal government."
 confederalism: "Confederalism"
 confederalism_noun: "Confederalist"
 confederalism_desc: "Confederalism is a political concept that supports the formation of a confederation, a union of sovereign states united for a common cause. As opposed to a Federation, Confederations seek to preserve its member states' independence, with the central government being beholden to them."
 constitutional_monarchy: "Constitutional Monarchy"
 constitutional_monarchy_noun: "Monarchist"
 constitutional_monarchy_desc: "Constitutional Monarchy is a form of monarchy in which the monarch exercises power in accordance with a constitution. Though it has a monarch, it exists only in name and mostly serves as a unifying symbol."
 semi_constitutional_monarchy: "Semi-constitutional Monarchy"
 semi_constitutional_monarchy_noun: "Monarchist"
 semi_constitutional_monarchy_desc: "Semi-constitutional Monarchy is a form of monarchy in which the monarch exercises power in accordance with a constitution. Contrary to Constitutional Monarchy however, the monarch still wields significant power in governance."
 religious_democracy: "Religious Democracy"
 religious_democracy_noun: "Religious Democrat"
 religious_democracy_desc: "Religious Democracy is a religious form of democracy where the values of a particular religion holds considerable influence in governance. Depending on the religion, Religious Democracies can vary and are vastly different from one another."
 authoritarian_democracy: "Authoritarian Democracy"
 authoritarian_democracy_noun: "Authoritarian Democrats"
 authoritarian_democracy_noun: "Authoritarian Democracy is a form of democracy where the executive branch of government holds all power. Though it may be contradictory, Authoritarian Democracies still feature elections whilst having a strong head of state."
 right_libertarianism: "Right-Libertarianism"
 right_libertarianism_noun: "Right-Libertarian"
 right_libertarianism_desc: "Right-wing Libertarianism is an ideology which places emphasis on civil liberties and the free market. Seen as a radical offshoot of Classical Liberalism, Right-Libertarians believe in expanded individual rights, laissez-faire economics and small government."
 herrenvolk_democracy: "Herrenvolk Democracy"
 herrenvolk_democracy_noun: "Herrenvolk Democrat"
 herrenvolk_democracy_desc: "Herrenvolk Democracy is a democratic form of ethnocracy in which one specific ethnicity gets voting rights while other groups are denied it. Though it still holds free elections, suffrage is restricted based on race."

 neutrality: "Non-Aligned"
 neutrality_noun: "Non-Aligned"
 neutrality_desc: "Neutral Nation"

 communism: "Communist"
 communism_noun: "Communism"
 communism_desc: "Socialist State"

 fascism: "Fascist"
 fascism_noun: "Fascism"
 fascism_desc: "Fascist Regime"