l_english:
 the_south_asunder: "The South Asunder"
 the_south_asunder_desc: "Away down south in the land of cotton, civil society has degraded into nothing but barbarism, with local militias arming themselves and taking the law into their own hands. Towns are burned to the ground, families are torn apart as chaos slowly engulfs the land, farms, houses, churches are turned into guerilla camps or religious structures used by the various cults and personal armies that now roam Dixie. In places that are still under nominal government control, protests and riots erupt in the streets as looting becomes commonplace. These conditions have led to a hardened populace, with many trying to scrape by using any means possible in order to survive this cruel place."

 jim_crow_laws: "Jim Crow Laws"
 jim_crow_laws_desc: "Segregationist laws and white supremacy have always been present throughout much of Dixieland’s history, from the founding of America to the old Confederacy and finally to the United States of Dixie. These laws have been to the detriment of black people with schools, restaurants and even bus seats being segregated. As such, racial tension between blacks and whites have always been high in this region, with many now resorting to lynchings and killings in order to satisfy their hatred of one another."

 disorganized_army: "Disorganized Army"
 disorganized_army_desc: "As chaos slowly engulfs the South, the Dixie army that was once victorious over the Federal government is now overstretched and overburdened as it tries to disperse both rioters and rebels alike. Due to this, our combat capabilities has been reduced significantly."